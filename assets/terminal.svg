<svg xmlns="http://www.w3.org/2000/svg" width="900" height="452" viewBox="0 0 900 452" role="img" aria-label="Konsole en CachyOS con fish: fastfetch de Marco, ingeniería de software, backend y apps multiplataforma. Stack: Go, Kotlin, C#.">
  <defs>
    <linearGradient id="cachy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5a0"/>
      <stop offset="1" stop-color="#00b4d8"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Hack, 'JetBrains Mono', 'DejaVu Sans Mono', Consolas, 'Courier New', monospace; font-size: 14px; fill: #d0d6e0; white-space: pre; }
    .m { fill: #6b7385; }
    .a { fill: #00d4aa; }
    .c { fill: #00b4d8; }
    .b { font-weight: 700; }
    .t { font-size: 13px; fill: #9aa3b5; }
    .ascii { fill: url(#cachy); }
    .wipe { fill: #11141a; transform-box: fill-box; transform-origin: right; animation: wipe var(--d, .7s) steps(var(--s, 10)) var(--w, 0s) both; }
    .in { animation: in .25s ease-out var(--w, 0s) both; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 1.4s steps(20) 4.9s both; }
    .cur { animation: in .1s 6.7s both, blink 1s steps(1) 6.8s infinite; }
    @keyframes wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  </style>

  <!-- ventana Konsole (KDE Breeze) -->
  <rect x="1" y="1" width="898" height="450" rx="5" fill="#11141a" stroke="#2a2f3a" stroke-width="1.5"/>
  <path d="M1 34 V6 a5 5 0 0 1 5 -5 H894 a5 5 0 0 1 5 5 V34 Z" fill="#1a1e26"/>
  <line x1="1" y1="34" x2="899" y2="34" stroke="#2a2f3a" stroke-width="1.5"/>
  <!-- icono konsole -->
  <rect x="14" y="10" width="18" height="15" rx="2" fill="#11141a" stroke="#00d4aa" stroke-width="1.3"/>
  <path d="M18 14.5 l3 3 l-3 3" fill="none" stroke="#00d4aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="23" y1="21" x2="28" y2="21" stroke="#00d4aa" stroke-width="1.4" stroke-linecap="round"/>
  <text class="t" x="450" y="22" text-anchor="middle">~ : fish — Konsole</text>
  <!-- botones Breeze: minimizar, maximizar, cerrar -->
  <g fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M820 15 l4.5 4.5 l4.5 -4.5"/>
    <path d="M844 20 l4.5 -4.5 l4.5 4.5"/>
    <path d="M869 13 l8 8 M877 13 l-8 8"/>
  </g>

  <!-- fastfetch -->
  <text x="24" y="62" textLength="128" lengthAdjust="spacingAndGlyphs"><tspan class="a b">marco</tspan><tspan class="m">@</tspan><tspan class="a b">cachyos</tspan> <tspan class="c">~</tspan>&gt;</text>
  <text x="160" y="62">fastfetch</text>
  <rect class="wipe" x="158" y="48" width="82" height="19" style="--w:.3s;--d:.7s;--s:9"/>

  <g xml:space="preserve">
    <text class="ascii in" x="24" y="110" textLength="370" lengthAdjust="spacingAndGlyphs" style="--w:1.10s">███╗   ███╗ █████╗ ██████╗  ██████╗ ██████╗ </text>
    <text class="ascii in" x="24" y="126" textLength="370" lengthAdjust="spacingAndGlyphs" style="--w:1.18s">████╗ ████║██╔══██╗██╔══██╗██╔════╝██╔═══██╗</text>
    <text class="ascii in" x="24" y="142" textLength="370" lengthAdjust="spacingAndGlyphs" style="--w:1.26s">██╔████╔██║███████║██████╔╝██║     ██║   ██║</text>
    <text class="ascii in" x="24" y="158" textLength="370" lengthAdjust="spacingAndGlyphs" style="--w:1.34s">██║╚██╔╝██║██╔══██║██╔══██╗██║     ██║   ██║</text>
    <text class="ascii in" x="24" y="174" textLength="370" lengthAdjust="spacingAndGlyphs" style="--w:1.42s">██║ ╚═╝ ██║██║  ██║██║  ██║╚██████╗╚██████╔╝</text>
    <text class="ascii in" x="24" y="190" textLength="370" lengthAdjust="spacingAndGlyphs" style="--w:1.50s">╚═╝     ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝ ╚═════╝ ╚═════╝ </text>
  </g>

  <text class="in" x="440" y="92"  style="--w:1.2s"><tspan class="a b">marco</tspan><tspan class="m">@</tspan><tspan class="a b">cachyos</tspan></text>
  <text class="m in" x="440" y="110" style="--w:1.3s">-------------</text>
  <text class="in" x="440" y="130" style="--w:1.4s"><tspan class="a b">OS</tspan><tspan class="m">:    </tspan>CachyOS x86_64</text>
  <text class="in" x="440" y="149" style="--w:1.5s"><tspan class="a b">Rol</tspan><tspan class="m">:   </tspan>ingeniería de software</text>
  <text class="in" x="440" y="168" style="--w:1.6s"><tspan class="a b">Foco</tspan><tspan class="m">:  </tspan>backend · apps multiplataforma</text>
  <text class="in" x="440" y="187" style="--w:1.7s"><tspan class="a b">Stack</tspan><tspan class="m">: </tspan>Go · Kotlin · C#</text>
  <text class="in" x="440" y="206" style="--w:1.8s"><tspan class="a b">Tools</tspan><tspan class="m">: </tspan>Git · Android Studio · Godot</text>
  <text class="in" x="440" y="225" style="--w:1.9s"><tspan class="a b">Ahora</tspan><tspan class="m">: </tspan>aprendiendo Kotlin Multiplatform</text>
  <g class="in" style="--w:2.0s">
    <rect x="440" y="240" width="24" height="12" rx="2" fill="#1a1e26"/>
    <rect x="468" y="240" width="24" height="12" rx="2" fill="#0a4a42"/>
    <rect x="496" y="240" width="24" height="12" rx="2" fill="#00806b"/>
    <rect x="524" y="240" width="24" height="12" rx="2" fill="#00b4a0"/>
    <rect x="552" y="240" width="24" height="12" rx="2" fill="#00e5a0"/>
    <rect x="580" y="240" width="24" height="12" rx="2" fill="#00b4d8"/>
  </g>

  <!-- git log -->
  <text x="24" y="292" textLength="128" lengthAdjust="spacingAndGlyphs"><tspan class="a b">marco</tspan><tspan class="m">@</tspan><tspan class="a b">cachyos</tspan> <tspan class="c">~</tspan>&gt;</text>
  <text x="160" y="292">git log --graph --oneline</text>
  <rect class="wipe" x="158" y="278" width="220" height="19" style="--w:2.3s;--d:1s;--s:25"/>

  <text class="in" x="24" y="316" style="--w:3.4s"><tspan class="a">*</tspan> <tspan class="m">a3f9c21</tspan> <tspan class="c">(HEAD -&gt; main)</tspan> feat: casos de uso de eventos</text>
  <text class="a in" x="24" y="333" style="--w:3.5s">|\</text>
  <text class="in" x="24" y="350" style="--w:3.6s"><tspan class="a">|</tspan> <tspan class="c">*</tspan> <tspan class="m">7b2e410</tspan> feat: modelo de datos de usuario</text>
  <text class="in" x="24" y="367" style="--w:3.7s"><tspan class="a">*</tspan> <tspan class="c">|</tspan> <tspan class="m">5d81c0e</tspan> feat: estructura de eventos</text>
  <text class="in" x="24" y="384" style="--w:3.8s"><tspan class="a">|</tspan><tspan class="c">/</tspan></text>
  <text class="in" x="24" y="401" style="--w:3.9s"><tspan class="a">*</tspan> <tspan class="m">1c0a9e3</tspan> init: proyecto multiplataforma</text>

  <!-- make build -->
  <text x="560" y="292" textLength="128" lengthAdjust="spacingAndGlyphs"><tspan class="a b">marco</tspan><tspan class="m">@</tspan><tspan class="a b">cachyos</tspan> <tspan class="c">~</tspan>&gt;</text>
  <text x="696" y="292">make build</text>
  <rect class="wipe" x="694" y="278" width="92" height="19" style="--w:4.1s;--d:.6s;--s:10"/>

  <text class="m in" x="560" y="316" style="--w:4.8s">compilando módulos…</text>
  <g class="in" style="--w:4.8s">
    <rect x="560" y="328" width="250" height="12" rx="2" fill="#1a1e26" stroke="#2a2f3a"/>
  </g>
  <rect class="bar" x="561" y="329" width="248" height="10" rx="1.5" fill="url(#cachy)"/>
  <text class="a in" x="820" y="339" style="--w:6.3s">100%</text>
  <text class="in" x="560" y="367" style="--w:6.4s"><tspan class="a">✓</tspan> build ok <tspan class="m">· 0 errores</tspan></text>

  <!-- prompt final -->
  <text class="in" x="24" y="432" textLength="128" lengthAdjust="spacingAndGlyphs" style="--w:6.7s"><tspan class="a b">marco</tspan><tspan class="m">@</tspan><tspan class="a b">cachyos</tspan> <tspan class="c">~</tspan>&gt;</text>
  <rect class="cur" x="160" y="419" width="9" height="16" fill="#00d4aa"/>
</svg>
