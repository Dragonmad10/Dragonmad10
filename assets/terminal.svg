  <!-- $ git log -->
  <text x="24" y="276"><tspan class="a">$</tspan> git log --graph --oneline</text>
  <rect class="wipe" x="38" y="262" width="226" height="19" style="--w:2.3s;--d:1s;--s:25"/>

  <text class="in" x="24" y="300" style="--w:3.4s"><tspan class="a">*</tspan> <tspan class="m">a3f9c21</tspan> <tspan class="a">(HEAD -&gt; main)</tspan> feat: casos de uso de eventos</text>
  <text class="a in" x="24" y="317" style="--w:3.5s">|\</text>
  <text class="in" x="24" y="334" style="--w:3.6s"><tspan class="a">| *</tspan> <tspan class="m">7b2e410</tspan> feat: modelo de datos de usuario</text>
  <text class="in" x="24" y="351" style="--w:3.7s"><tspan class="a">* |</tspan> <tspan class="m">5d81c0e</tspan> feat: estructura de eventos</text>
  <text class="a in" x="24" y="368" style="--w:3.8s">|/</text>
  <text class="in" x="24" y="385" style="--w:3.9s"><tspan class="a">*</tspan> <tspan class="m">1c0a9e3</tspan> init: proyecto multiplataforma</text>

  <!-- $ make build -->
  <text x="560" y="276"><tspan class="a">$</tspan> make build</text>
  <rect class="wipe" x="574" y="262" width="92" height="19" style="--w:4.1s;--d:.6s;--s:10"/>

  <text class="m in" x="560" y="300" style="--w:4.8s">compilando módulos…</text>
  <g class="in" style="--w:4.8s">
    <rect x="560" y="312" width="250" height="12" rx="2" fill="#161b22" stroke="#30363d"/>
  </g>
  <rect class="bar" x="561" y="313" width="248" height="10" rx="1.5" fill="#26a641"/>
  <text class="a in" x="820" y="323" style="--w:6.3s">100%</text>
  <text class="in" x="560" y="351" style="--w:6.4s"><tspan class="a">✓</tspan> build ok <tspan class="m">· 0 errores</tspan></text>

  <!-- prompt final -->
  <text class="in" x="24" y="414" style="--w:6.7s"><tspan class="a">$</tspan></text>
  <rect class="cur" x="38" y="401" width="9" height="16" fill="#3fb950"/>
